name: ODROID M1S UPS (NUT)
slug: odroid_m1s_ups
description: Serial bridge for the Hardkernel UPS Kit for ODROID-M1S
version: 0.2.0
url: https://github.com/snpv42/ha-odroid-m1s-ups
startup: services
boot: auto
init: false
arch:
  - aarch64
uart: true
usb: true
ports:
  3493/tcp: 3493
ports_description:
  3493/tcp: Network UPS Tools server
options:
  serial_port: /dev/ttyACM0
  baudrate: 115200
  ups_name: odroid_m1s_ups
  username: nut
  password: change-me-now
  additional_devices: []
  on_battery_regex: '(?i)\b(on[ _-]?battery|battery mode|power (?:fail|lost)|ac (?:off|fail))\b'
  online_regex: '(?i)\b(on[ _-]?line|line power|mains (?:restored|ok)|ac (?:on|ok))\b'
  low_battery_regex: '(?i)\b(low[ _-]?battery|battery[ _-]?low|low batt)\b|^\s*LB\s*$'
  battery_charge_regex: '(?i)(?:battery|charge)\D{0,12}(\d{1,3})\s*%'
  battery_voltage_regex: '(?i)(?:battery|batt)\D{0,12}(\d(?:\.\d+)?)\s*V'
  raw_log: false
schema:
  serial_port: str
  baudrate: int
  ups_name: match(^[A-Za-z0-9_-]+$)
  username: match(^[A-Za-z0-9_]+$)
  password: password
  additional_devices:
    - name: match(^[A-Za-z0-9_-]+$)
      driver: str
      port: str
      config:
        - str
  on_battery_regex: str
  online_regex: str
  low_battery_regex: str
  battery_charge_regex: str
  battery_voltage_regex: str
  raw_log: bool
